name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      # Backend
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - 'backend/**'

      # Frontend
      - 'frontend/stackpulse-ui/**'

      # Python AI service
      - 'services/ai-service/**'

      # Java AWS deployment
      - 'deployment/StackPulseAwsDeployment/**'

      # CI itself
      - '.github/workflows/ci.yml'

  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      # Backend
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - 'backend/**'

      # Frontend
      - 'frontend/stackpulse-ui/**'

      # Python AI service
      - 'services/ai-service/**'

      # Java AWS deployment
      - 'deployment/StackPulseAwsDeployment/**'

      # CI itself
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore StackPulse.sln

      - name: Build backend
        run: dotnet build StackPulse.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test StackPulse.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/stackpulse-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/stackpulse-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  ai-service:
    name: Python AI Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-service/requirements.txt

      - name: Install AI service dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app

      - name: Import AI service
        run: python -c "from app.main import app; print(app.title)"

  java-deployment:
    name: Java AWS Deployment
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: deployment/StackPulseAwsDeployment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Java deployment project
        run: mvn -B clean package

      - name: Run Java tests
        run: mvn -B test